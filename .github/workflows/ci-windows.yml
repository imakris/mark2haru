name: CI Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows
    runs-on: windows-2025-vs2026
    env:
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.51'
      - uses: mozilla-actions/sccache-action@v0.0.11

      - name: Verify Visual Studio 2026 environment
        shell: pwsh
        run: |
          if ($env:VisualStudioVersion -ne '18.0' -or $env:VCToolsVersion -notlike '14.51.*') {
            throw 'Visual Studio 2026 with MSVC v145 is required'
          }

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DMARK2HARU_BUILD_CLI=ON
          -DMARK2HARU_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Retain CLI for PDF reader validation
        uses: actions/upload-artifact@v4
        with:
          name: mark2haru-windows
          path: build/mark2haru.exe
          if-no-files-found: error
          retention-days: 7

      - name: Install and test downstream consumer
        shell: bash
        run: .github/scripts/consumer_smoke.sh build
